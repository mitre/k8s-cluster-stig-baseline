name: k8s-cluster-stig-baseline
title: Kubernetes 1.16 Based upon Kubernetes 1.16 Security Technical Implementation Guideline (STIG) 
maintainer: MITRE SAF Team
copyright: MITRE, 2022
copyright_email: saf@groups.mitre.org
license: Apache-2.0
summary: InSpec testing for baseline compliance with the Kubernetes STIG
description: An InSpec profile verifying compliance with Kubernetes STIG version 1.16 
version: 1.0.1
inspec_version: ">= 4.0"
supports:
- platform: k8s

depends:
- name: inspec-k8s
  url: https://github.com/inspec/inspec-k8s/archive/refs/tags/0.1.3.tar.gz

inputs:
  - name: k8s_minium_version
    desc: Minimum permitted Kubernetes version
    type: String
    value: 'v1.19.5'
    required: true

  # SV-242383
  - name: approved_system_services
    description: Service names allowed to run in system namespaces
    type: Array
    value:
      - kube-dns
      - kubernetes

  - name: approved_system_pods
    description: Pods allowed to run in system namespaces
    type: Array
    value:
      - coredns
      - etcd
      - kindnet
      - kube-apiserver
      - kube-controller-manager
      - kube-proxy
      - kube-scheduler
      - storage-provisioner

  # SV-242383, SV-242414
  - name: system_namespaces
    description: Namespaces where core Kubernetes services run that should not have any user-created resources
    type: Array
    value:
      - default
      - kube-public
      - kube-node-lease
      - kube-system

  # SV-242414
  - name: min_allowed_host_port
    desc: Mimimum host on the port that Kubernetes user pods can use
    type: Numeric
    value: 1024