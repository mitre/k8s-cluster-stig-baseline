name: k8s-cluster-stig-baseline
title: Kubernetes 1.16 Based upon Kubernetes 1.16 Security Technical Implementation Guideline (STIG) 
maintainer: MITRE SAF Team
copyright: MITRE, 2022
copyright_email: saf@groups.mitre.org
license: Apache-2.0
summary: InSpec testing for baseline compliance with the Kubernetes STIG
description: An InSpec profile verifying compliance with Kubernetes STIG version 1.16 
version: 1.0.1
inspec_version: ">= 4.0"
supports:
- platform: k8s

depends:
- name: inspec-k8s
  url: https://github.com/inspec/inspec-k8s/archive/refs/tags/0.1.3.tar.gz

inputs:
  - name: k8s_minium_version
    description: 'Minimum version of Kubernetes deployment'
    type: string
    value: 'v1.19.5'
    required: true

  - name: pod_security_admission_minimum_level
    description: 'Minimum Pod Security Admission enforce level for application namespaces'
    type: string
    value: 'baseline'
    required: true

  - name: pod_security_admission_exempt_namespaces
    description: 'Namespaces exempt from the Pod Security Admission enforce-label check'
    type: array
    value:
      - kube-system
      - kube-public
      - kube-node-lease
    required: true
