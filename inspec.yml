name: k8s-cluster-stig-baseline
title: Kubernetes STIG V2R6 Cluster Checks
maintainer: MITRE SAF Team
copyright: MITRE, 2022
copyright_email: saf@groups.mitre.org
license: Apache-2.0
summary: InSpec testing for baseline compliance with the Kubernetes STIG
description: An InSpec profile verifying Kubernetes STIG V2R6 cluster requirements.
version: 1.0.1
inspec_version: ">= 4.0"
supports:
- platform: k8s

depends:
# The 0.1.3 tag predates commit 40ecdc2 (2022-07-14), which replaced the
# name/namespace-only fetch_data with build_record_from. There is no tag or
# release carrying that fix, so this pins a commit.
- name: inspec-k8s
  git: https://github.com/inspec/inspec-k8s.git
  commit: 95866b7e59cdc4456b92e2bffad33daaa009920d

inputs:
  # SV-242443
  - name: approved_kubernetes_server_versions
    description: 'Kubernetes API server versions currently authorized by IAVMs, CTOs, DTMs, and STIGs; leave empty to require manual review'
    type: array
    value: []
    required: true

  # SV-254800, SV-254801, SV-274882
  - name: control_plane_namespace
    description: 'Namespace where the Kubernetes control-plane static Pods are exposed'
    type: string
    value: 'kube-system'
    required: true

  # SV-254801
  - name: control_plane_static_pod_components
    description: 'Control-plane static Pod components to inspect for the PodSecurity feature gate on Kubernetes versions before 1.25'
    type: array
    value:
      - kube-apiserver
      - kube-controller-manager
      - kube-scheduler
    required: true
